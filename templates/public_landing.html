<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pawsie - Find Pet Sitters Near You</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
</head>
<body class="public-page">
    <div class="container py-5">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-10">
                <div class="hero-card p-4 p-md-5">
                    <div class="row align-items-center g-4">
                        <div class="col-lg-6">
                            <p class="eyebrow mb-3">Your pet in good hands</p>
                            <h1 class="display-5 fw-bold mb-3">Pawsie: find trusted pet sitters in Sydney</h1>
                            <p class="lead mb-0">
                                We treat your furry friend like family.
                            </p>
                        </div>
                        <div class="col-lg-6">
                            <div class="card border-0 public-panel">
                                <div class="card-body p-4">
                                    <h2 class="h4 mb-4">Start your search</h2>
                                    <form method="GET" action="{{ url_for('public_results_search') }}">
                                        <div class="mb-3">
                                            <label for="service_type" class="form-label">I'm looking for</label>
                                            <select name="service_type" id="service_type" class="form-select" required>
                                                <option value="" selected disabled>Select a service</option>
                                                <option value="boarding">Boarding</option>
                                                <option value="daycare">Daycare</option>
                                                <option value="walking">Walking</option>
                                            </select>
                                        </div>

                                        <div class="mb-4">
                                            <label for="suburb" class="form-label">Near</label>
                                            <input
                                                type="text"
                                                name="suburb"
                                                id="suburb"
                                                class="form-control"
                                                list="suburbs-list"
                                                placeholder="Type a Sydney suburb"
                                                autocomplete="off">
                                        </div>

                                        <div class="d-grid">
                                            <button type="submit" class="btn find-btn btn-lg">Find</button>
                                        </div>
                                    </form>

                                    <div class="mt-3 text-center">
                                        <a href="{{ url_for('login') }}" class="text-decoration-none">Already have an account? Log in</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
