<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pawsie - Find Pet Sitters Near You</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --pawsie-sand: #f6efe5;
            --pawsie-ink: #24323d;
            --pawsie-coral: #d97757;
            --pawsie-gold: #f0bd63;
        }

        body {
            background:
                linear-gradient(135deg, rgba(246, 239, 229, 0.96), rgba(255, 255, 255, 0.90)),
                url('https://offthestream.com/wp-content/uploads/2025/12/unsplash-pawsie-1974.webp') center/cover fixed;
            color: var(--pawsie-ink);
            min-height: 100vh;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.92);
            border: 0;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(36, 50, 61, 0.14);
            backdrop-filter: blur(8px);
        }

        .eyebrow {
            color: var(--pawsie-coral);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .find-btn {
            background: linear-gradient(135deg, var(--pawsie-coral), var(--pawsie-gold));
            border: 0;
            color: white;
            font-weight: 700;
        }

        .find-btn:hover {
            color: white;
            opacity: 0.95;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-10">
                <div class="hero-card p-4 p-md-5">
                    <div class="row align-items-center g-4">
                        <div class="col-lg-6">
                            <p class="eyebrow mb-3">For Pet Owners</p>
                            <h1 class="display-5 fw-bold mb-3">Find trusted pet sitters in Sydney.</h1>
                            <p class="lead mb-0">
                                Search by service and suburb, compare available sitters, and sign in when you are ready to book.
                            </p>
                        </div>
                        <div class="col-lg-6">
                            <div class="card border-0 bg-light-subtle">
                                <div class="card-body p-4">
                                    <h2 class="h4 mb-4">Start your search</h2>
                                    <form method="GET" action="{{ url_for('public_results_search') }}">
                                        <div class="mb-3">
                                            <label for="service_type" class="form-label">I'm looking for</label>
                                            <select name="service_type" id="service_type" class="form-select" required>
                                                <option value="" selected disabled>Select a service</option>
                                                <option value="boarding">Boarding</option>
                                                <option value="daycare">Daycare</option>
                                                <option value="walking">Walking</option>
                                            </select>
                                        </div>

                                        <div class="mb-4">
                                            <label for="suburb" class="form-label">Near</label>
                                            <input
                                                type="text"
                                                name="suburb"
                                                id="suburb"
                                                class="form-control"
                                                list="suburbs-list"
                                                placeholder="Type a Sydney suburb"
                                                autocomplete="off">
                                            <datalist id="suburbs-list">
                                                {% for suburb in suburbs %}
                                                <option value="{{ suburb }}"></option>
                                                {% endfor %}
                                            </datalist>
                                        </div>

                                        <div class="d-grid">
                                            <button type="submit" class="btn find-btn btn-lg">Find</button>
                                        </div>
                                    </form>

                                    <div class="mt-3 text-center">
                                        <a href="{{ url_for('login') }}" class="text-decoration-none">Already have an account? Log in</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
