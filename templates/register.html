<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sniff Snuff - PetSitters</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Register in SniffSnuff</h2>
                    <h5 class="card-title text-center mb-4">Join the greatest community of petlovers in Sydney!</h5>
                    
                    <!-- Flash messages -->
                    {% with messages = get_flashed_messages(with_categories=True) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} mb-2">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <!-- Registration Form -->
                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label for="role" class="form-label">Choose what describes you most</label>
                            <select name="role" id="role" class="form-select" required>
                                <option value="" disabled selected>Select here...</option>
                                <option value="customer">I want to hire a Pet Sitter</option>
                                <option value="sitter">I want to work as Pet Sitter</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Your email</label>
                            <input type="email" name="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Your password</label>
                            <input type="password" name="password" id="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>

                    <p class="text-center mt-3 text-muted">SniffSnuff - All rights reserved - 2025</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle (optional for some components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
