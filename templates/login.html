<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pawsie - PetSitters</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
</head>
<body class="public-page">

<div class="container auth-wrap d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100">
        <div class="col-md-6">
            <div class="card auth-card">
                <div class="card-body">
                    <p class="eyebrow text-center mb-2">Welcome Back</p>
                    <h2 class="card-title text-center mb-4">Login</h2>
                    <h5 class="card-title text-center mb-4">Ready to get some paw love again?</h5>
                    
                    <!-- Flash messages -->
                    {% with messages = get_flashed_messages(with_categories=True) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} mb-2">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <!-- Registration Form -->
                    <form method="POST" action="{{ url_for('login') }}">                     
                        <div class="mb-3">
                            <label for="email" class="form-label">Your email</label>
                            <input type="email" name="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Your password</label>
                            <input type="password" name="password" id="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    <div class="d-flex justify-content-center">
                        <a href="{{ url_for('register') }}" class="page-link-inline">I'm not a user yet</a>
                    </div>

                    <p class="text-center mt-3 text-muted">Pawsie - All rights reserved - 2025</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle (optional for some components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
