<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pawsie - Pet Sitters</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .background-image {
            background-image: url('https://offthestream.com/wp-content/uploads/2025/12/unsplash-pawsie-1974.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .transparent-card {
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="background-image">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow transparent-card">
                    <div class="card-body text-center p-5">
                        <h1 class="card-title mb-4">🐾 Pawsie</h1>
                        <p class="text-muted mb-4">The greatest community of pet lovers in Sydney!</p>
                        
                        <div class="d-grid gap-3">
                            <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg">Login</a>
                            <a href="{{ url_for('register') }}" class="btn btn-outline-primary btn-lg">Create Account</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
